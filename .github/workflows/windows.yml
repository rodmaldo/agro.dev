name: Windows (instalador + portable)
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Motor Python (dependencias + prueba)
        run: |
          python -m pip install -r engine/requirements.txt
          python engine/test_engine.py
          python engine/test_gains.py
      - name: Motor Python -> agro_engine.exe (PyInstaller, carpeta)
        run: |
          pyinstaller --noconfirm --onedir --name agro_engine --collect-all rasterio --hidden-import mosaic_gps --hidden-import photo_align --hidden-import photo_match --collect-all cv2 --distpath engine-build engine/agro_engine.py
          New-Item -ItemType Directory -Force desktop/engine-dist | Out-Null
          Copy-Item engine-build/agro_engine/* desktop/engine-dist -Recurse -Force
      - name: Electron -> instalador (y publicación de la actualización si hay token)
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # versión visible en el nombre del .exe y en el pie de la app: 0.4.<número de ejecución> (sube sola con cada build)
          npm version "0.4.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          npm install
          node scripts/copy-web.js
          if ($env:GH_TOKEN) { npx electron-builder --win --x64 --publish always } else { Write-Host 'Sin RELEASES_TOKEN: se arma el instalador pero no se publica la actualización'; npx electron-builder --win --x64 --publish never }
      - uses: actions/upload-artifact@v4
        with:
          name: agro.dev-windows-v0.4.${{ github.run_number }}
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
